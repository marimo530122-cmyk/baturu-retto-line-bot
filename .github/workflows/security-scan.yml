name: セキュリティ点検(依存ライブラリの脆弱性)

# いつ動くか:
# - main への push と プルリクエスト(依存ファイルを変えたとき)
# 鍵の書き込みチェック(gitleaks)は secret-scan.yml で毎回動く
# - 毎週月曜 朝9時(日本時間)。コードを変えていなくても、新しく見つかった穴を拾うため
# - Actions の画面から手動(Run workflow)
on:
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/requirements*.txt"
      - ".github/workflows/security-scan.yml"
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/requirements*.txt"
      - ".github/workflows/security-scan.yml"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [".", automation, sengoku-shield, realtime-minutes, medical-ai/frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 本番で動く依存だけを見る。high 以上があれば赤(失敗)にする
      - name: npm audit
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high

  pip-audit:
    name: pip-audit (${{ matrix.req }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        req:
          - medical-ai/backend/requirements.txt
          - medical-ai-local/requirements.txt
          - freelance/requirements.txt
          - scripts/requirements.txt
          - scripts/requirements-haccp.txt
          - scripts/requirements-video-edit.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --progress-spinner off -r "${{ matrix.req }}"

  notify:
    name: 失敗したら Discord / Slack に知らせる
    runs-on: ubuntu-latest
    needs: [npm-audit, pip-audit]
    if: failure() && github.event_name != 'pull_request'
    steps:
      - name: 通知
        env:
          WEBHOOK: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "SECURITY_ALERT_WEBHOOK_URL 未設定のため通知しません"; exit 0; fi
          MSG="【セキュリティ点検】依存ライブラリに脆弱性が見つかりました: $RUN_URL"
          case "$WEBHOOK" in
            *discord.com/api/webhooks/*|*discordapp.com/api/webhooks/*) BODY=$(jq -n --arg m "$MSG" '{content:$m}') ;;
            *) BODY=$(jq -n --arg m "$MSG" '{text:$m}') ;;
          esac
          curl -fsS -X POST -H "Content-Type: application/json" -d "$BODY" "$WEBHOOK"
