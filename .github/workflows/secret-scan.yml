name: 鍵(APIキー・パスワード)の書き込みチェック

# どの push・プルリクエストでも、gitleaks で鍵が書き込まれていないか調べる。
# 見つかったら docs/SECURITY.md の「万が一、鍵が漏れたときの手順」で、まず鍵を無効にする。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action がプルリクエストのコミット一覧を読むため
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 過去のコミットも含めて調べる(消したつもりの鍵も履歴には残るため)
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: 失敗したら Discord / Slack に知らせる
    runs-on: ubuntu-latest
    needs: [gitleaks]
    if: failure() && github.event_name != 'pull_request'
    steps:
      - name: 通知
        env:
          WEBHOOK: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "SECURITY_ALERT_WEBHOOK_URL 未設定のため通知しません"; exit 0; fi
          MSG="【セキュリティ点検】リポジトリに鍵(APIキー等)が書き込まれた可能性があります。すぐ docs/SECURITY.md の手順で無効化を: $RUN_URL"
          case "$WEBHOOK" in
            *discord.com/api/webhooks/*|*discordapp.com/api/webhooks/*) BODY=$(jq -n --arg m "$MSG" '{content:$m}') ;;
            *) BODY=$(jq -n --arg m "$MSG" '{text:$m}') ;;
          esac
          curl -fsS -X POST -H "Content-Type: application/json" -d "$BODY" "$WEBHOOK"
