name: 鮮刻シールド だまされたふりAIの練習(本物の Claude)

# 手で動かすときだけ実行する(1回で数十円ほど Claude の料金がかかる)。
# 結果(犯人役の台本と AI の返事)は実行ログに出るだけで、リポジトリには保存しない。
on:
  workflow_dispatch:
    inputs:
      model:
        description: "使うモデル(空なら既定。例: claude-opus-5-5 / claude-sonnet-5-5)"
        required: false
        default: ""

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sengoku-shield
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存パッケージのインストール
        run: npm ci

      - name: 練習(犯人役の台本を流して、AIの返事を表示)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHIELD_AI_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$SHIELD_AI_MODEL" ]; then unset SHIELD_AI_MODEL; fi
          # 登録したキーの前後に改行や空白が入っていると「キーが無効」になるので取り除く
          ANTHROPIC_API_KEY="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
          # 名前ごと貼ってしまった場合(ANTHROPIC_API_KEY=sk-...)は、名前の部分を取り除く
          ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY#ANTHROPIC_API_KEY=}"
          export ANTHROPIC_API_KEY
          # キーそのものは表示せず、形だけを確かめる(長さと、正しい書き出しかどうか)
          case "$ANTHROPIC_API_KEY" in
            sk-ant-api*) START="sk-ant-api で始まる(正しい形)" ;;
            sk-ant-admin*) START="sk-ant-admin で始まる(管理用のキー。Claude を呼ぶには普通の API キーが要る)" ;;
            sk-ant-*) START="sk-ant- で始まるが api ではない" ;;
            "") START="空(登録されていない)" ;;
            *) START="sk-ant- で始まらない(キー以外の文字が入っている)" ;;
          esac
          echo "登録されたキーの形: ${#ANTHROPIC_API_KEY} 文字 / ${START}"
          node rehearsal.js
