name: Auto Edit Video

on:
  # スマホのショートカット等から curl で叩く場合:
  #   POST https://api.github.com/repos/<owner>/<repo>/dispatches
  #   { "event_type": "auto_edit_video", "client_payload": { "video_url": "https://drive.google.com/...", "title": "...", "ai": "true" } }
  repository_dispatch:
    types: [auto_edit_video]
  # GitHubモバイルアプリ / Web UI からの手動実行
  workflow_dispatch:
    inputs:
      video_url:
        description: "撮影素材のURL(Googleドライブの共有リンク可。「リンクを知っている全員」に共有しておく)"
        required: false
        type: string
      video_path:
        description: "リポジトリ内の動画パスを使う場合(video_urlより優先度低)"
        required: false
        type: string
      title:
        description: "画面上部に常時表示するタイトル(省略可)"
        required: false
        type: string
      ai:
        description: "Claudeで言い直し・撮り直しの文も削除する"
        required: false
        type: boolean
        default: true
      whisper_model:
        description: "文字起こしモデル(tiny/base/small/medium。大きいほど正確で遅い)"
        required: false
        type: string
        default: small

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-video-edit.txt

      # 文字起こしモデル(数百MB)を毎回ダウンロードしないようにキャッシュ
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ github.event.client_payload.whisper_model || github.event.inputs.whisper_model || 'small' }}

      - name: Auto edit
        id: edit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.inputs.video_url }}
          VIDEO_PATH: ${{ github.event.client_payload.video_path || github.event.inputs.video_path }}
          TITLE: ${{ github.event.client_payload.title || github.event.inputs.title }}
          USE_AI: ${{ github.event.client_payload.ai || github.event.inputs.ai }}
          WHISPER_MODEL: ${{ github.event.client_payload.whisper_model || github.event.inputs.whisper_model || 'small' }}
        run: |
          INPUT="${VIDEO_URL:-$VIDEO_PATH}"
          if [ -z "$INPUT" ]; then
            echo "video_url または video_path を指定してください。" >&2
            exit 1
          fi
          ARGS=(--input "$INPUT")
          if [ -n "$TITLE" ]; then ARGS+=(--title "$TITLE"); fi
          if [ "$USE_AI" = "true" ] && [ -n "$ANTHROPIC_API_KEY" ]; then ARGS+=(--ai); fi

          TAG="edit-$(date -u +%Y%m%d-%H%M%S)"
          python scripts/auto_edit_video.py "${ARGS[@]}" --output "output/$TAG.mp4"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      # スマホ納品ルート: 完成動画・編集レポート・プレビュー画像をReleaseに添付
      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.edit.outputs.tag_name }}
          name: ${{ steps.edit.outputs.tag_name }}
          body_path: output/${{ steps.edit.outputs.tag_name }}.report.md
          files: |
            output/${{ steps.edit.outputs.tag_name }}.mp4
            output/${{ steps.edit.outputs.tag_name }}.preview*.jpg
            output/${{ steps.edit.outputs.tag_name }}.transcript.json
