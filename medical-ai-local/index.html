<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>医療AI ローカル完結アプリ</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f4f7f6;
    color: #1f2937;
  }
  header {
    background: #0f766e;
    color: #fff;
    padding: 14px 20px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: 0.85; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    gap: 16px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px;
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
  }
  .btn-primary { background: #0f766e; color: #fff; }
  .btn-danger { background: #b91c1c; color: #fff; }
  .btn-secondary { background: #e5e7eb; color: #1f2937; }
  .btn-accent { background: #2563eb; color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  input[type="text"], textarea, select {
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  #transcript {
    height: 220px;
    overflow-y: auto;
    background: #f9fafb;
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 8px;
    font-size: 14px;
  }
  .seg-doctor { color: #0f766e; font-weight: 600; }
  .seg-patient { color: #1f2937; font-weight: 600; }
  .seg-staff { color: #7c3aed; font-weight: 600; }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .badge-green { background: #d1fae5; color: #065f46; }
  .badge-gray { background: #f3f4f6; color: #6b7280; }
  .badge-amber { background: #fef3c7; color: #92400e; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .field { border: 1px solid #f3f4f6; background: #f9fafb; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  .field-label { font-size: 12px; font-weight: 700; color: #0f766e; margin-bottom: 4px; }
  .field-value { font-size: 14px; white-space: pre-wrap; }
  .muted { color: #9ca3af; font-size: 13px; }
  .status-line { font-size: 12px; color: #6b7280; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>医療AI ローカル完結アプリ</h1>
  <p>音声・カルテ生成のすべてがこのPC上で完結します（外部クラウドAPIへの送信なし）</p>
</header>

<main>
  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <div class="row">
        <span id="badge-whisper" class="badge badge-gray">Whisper: 確認中...</span>
        <span id="badge-ollama" class="badge badge-gray">ローカルLLM: 確認中...</span>
      </div>
      <button class="btn-secondary" onclick="resetSession()">新しい診察を開始（リセット）</button>
    </div>
    <p class="status-line" id="status-detail"></p>
  </div>

  <div class="grid2">
    <div class="card">
      <h3 style="margin-top:0;">リアルタイム議事録</h3>
      <div id="transcript"></div>

      <div class="row" style="margin-top:10px;">
        <button id="mic-btn" class="btn-accent" onclick="toggleMic()">マイク開始</button>
        <span class="row">
          話者:
          <select id="speaker-select">
            <option value="doctor">医師</option>
            <option value="patient" selected>患者</option>
            <option value="staff">スタッフ</option>
          </select>
        </span>
      </div>
      <p class="muted" style="font-size:12px;">
        ※1本のマイクで録音するため、話者の自動判別（話者分離）は行っていません。
        発言者が変わったら上のプルダウンで切り替えてください。
      </p>

      <div class="row" style="margin-top:10px;">
        <input id="manual-text" type="text" placeholder="手動入力（マイクなしモード/デモ用）" style="flex:1;" />
        <button class="btn-primary" onclick="sendManualText()">追加</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">アンビエントスクライブ ライブプレビュー</h3>
      <p class="muted" style="margin-top:-8px;">手動入力なし・会話から自動更新（ローカルLLM生成）</p>
      <div id="draft-fields"></div>
    </div>
  </div>
</main>

<script>
const CHUNK_MS = 6000; // マイク録音のチャンク長（ミリ秒）。短くすると反応は速いが精度が落ちやすい。
const LIVE_DRAFT_DEBOUNCE_MS = 1500;

let mediaStream = null;
let mediaRecorder = null;
let recording = false;
let liveDraftTimer = null;

const fieldLabels = {
  chief_complaint: "主訴・症状の要約",
  clinical_reasoning: "治療方針・提案",
  prescription_draft: "処方内容・アドバイス",
  referral_letter: "紹介状・診療情報提供書",
};

function speakerClass(speaker) {
  return { doctor: "seg-doctor", patient: "seg-patient", staff: "seg-staff" }[speaker] || "";
}
function speakerLabel(speaker) {
  return { doctor: "医師", patient: "患者", staff: "スタッフ" }[speaker] || "話者不明";
}

function appendTranscriptUI(speaker, text) {
  const box = document.getElementById("transcript");
  const div = document.createElement("div");
  div.innerHTML = `<span class="${speakerClass(speaker)}">${speakerLabel(speaker)}:</span> ${text}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function renderDraft(draft) {
  const container = document.getElementById("draft-fields");
  container.innerHTML = "";
  let any = false;
  for (const key of Object.keys(fieldLabels)) {
    const value = (draft[key] || "").trim();
    if (!value) continue;
    any = true;
    const div = document.createElement("div");
    div.className = "field";
    div.innerHTML = `<div class="field-label">${fieldLabels[key]}</div><div class="field-value"></div>`;
    div.querySelector(".field-value").textContent = value;
    container.appendChild(div);
  }
  if (!any) {
    container.innerHTML = '<p class="muted">会話が始まると、ここに主訴・治療方針・処方・紹介状のドラフトが自動的に表示されます。</p>';
  }
  const engineNote = document.createElement("p");
  engineNote.className = "muted";
  engineNote.style.fontSize = "11px";
  engineNote.textContent = "生成エンジン: " + (draft.engine || "none");
  container.appendChild(engineNote);
}

function scheduleLiveDraftRefresh() {
  if (liveDraftTimer) clearTimeout(liveDraftTimer);
  liveDraftTimer = setTimeout(async () => {
    const res = await fetch("/api/live-draft/refresh", { method: "POST" });
    const draft = await res.json();
    renderDraft(draft);
  }, LIVE_DRAFT_DEBOUNCE_MS);
}

async function sendManualText() {
  const input = document.getElementById("manual-text");
  const text = input.value.trim();
  if (!text) return;
  const speaker = document.getElementById("speaker-select").value;
  input.value = "";
  const res = await fetch("/api/manual-text", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ speaker, text }),
  });
  const data = await res.json();
  appendTranscriptUI(speaker, text);
  scheduleLiveDraftRefresh();
}

function pickMimeType() {
  const candidates = [
    "audio/webm;codecs=opus",
    "audio/webm",
    "audio/ogg;codecs=opus",
    "audio/mp4",
  ];
  return candidates.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
}

async function toggleMic() {
  if (recording) {
    stopMicCycle();
  } else {
    await startMicCycle();
  }
}

async function startMicCycle() {
  const mimeType = pickMimeType();
  if (!mimeType) {
    alert("このブラウザはMediaRecorderに対応していません。Chrome/Edge/Firefoxをお使いください。下の手動入力をご利用いただくこともできます。");
    return;
  }
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    alert("マイクにアクセスできませんでした: " + e);
    return;
  }
  recording = true;
  document.getElementById("mic-btn").textContent = "マイク停止";
  document.getElementById("mic-btn").className = "btn-danger";
  recordOneChunk(mimeType);
}

function recordOneChunk(mimeType) {
  if (!recording || !mediaStream) return;
  const chunks = [];
  mediaRecorder = new MediaRecorder(mediaStream, { mimeType });
  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) chunks.push(e.data);
  };
  mediaRecorder.onstop = async () => {
    const blob = new Blob(chunks, { type: mimeType });
    await sendAudioChunk(blob);
    if (recording) recordOneChunk(mimeType);
  };
  mediaRecorder.start();
  setTimeout(() => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  }, CHUNK_MS);
}

function stopMicCycle() {
  recording = false;
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
  document.getElementById("mic-btn").textContent = "マイク開始";
  document.getElementById("mic-btn").className = "btn-accent";
}

async function sendAudioChunk(blob) {
  if (blob.size < 800) return; // 極端に短い/無音チャンクは送らない
  const speaker = document.getElementById("speaker-select").value;
  const form = new FormData();
  form.append("audio", blob, "chunk.webm");
  form.append("speaker", speaker);
  try {
    const res = await fetch("/api/transcribe-chunk", { method: "POST", body: form });
    const data = await res.json();
    if (data.text && data.text.trim()) {
      appendTranscriptUI(speaker, data.text.trim());
      scheduleLiveDraftRefresh();
    }
  } catch (e) {
    console.error("文字起こしエラー", e);
  }
}

async function resetSession() {
  await fetch("/api/reset", { method: "POST" });
  document.getElementById("transcript").innerHTML = "";
  renderDraft({});
}

async function refreshStatus() {
  try {
    const res = await fetch("/api/status");
    const s = await res.json();
    const w = document.getElementById("badge-whisper");
    w.textContent = "Whisper: " + s.whisper_model + (s.whisper_loaded ? "（読込済み）" : "（初回発話時に読込）");
    w.className = "badge " + (s.whisper_loaded ? "badge-green" : "badge-blue");

    const o = document.getElementById("badge-ollama");
    if (s.ollama_reachable) {
      o.textContent = "ローカルLLM: 接続済み (" + s.ollama_model + ")";
      o.className = "badge badge-green";
    } else {
      o.textContent = "ローカルLLM: 未接続（MOCK表示になります）";
      o.className = "badge badge-amber";
    }
    document.getElementById("status-detail").textContent =
      s.ollama_reachable ? "" : "Ollamaが起動していません。README.mdの手順でOllamaを起動すると、実際のローカルAI生成に切り替わります。";
  } catch (e) {
    console.error(e);
  }
}

renderDraft({});
refreshStatus();
setInterval(refreshStatus, 8000);
</script>
</body>
</html>
